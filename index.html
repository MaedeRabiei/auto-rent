<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style.css">
  <title>اُتــورِنت</title>
</head>
<header
  class="flex justify-between lg:w-10/12 bg-white mx-auto lg:p-4 md:p-3  sm:p-2 items-center  rounded-b-xl sticky top-0 z-50">
  <!-- logo -->
  <div class="w-32 md:w-40 ">
    <img src="./public/img/Logo.png" alt="logo">
  </div>

  <!-- navbar -->
  <nav class="hidden md:block">
    <ul class="flex items-center gap-5 lg:gap-10 text-sm lg:text-base">
      <li>رزرو خودرو</li>
      <li>خدمات ما</li>
      <li>بلاگ</li>
      <li>درباره ما</li>
      <li>تماس با ما</li>
      <li><img width="20" src="./public/img/icons/search.svg" alt="search"></li>
    </ul>
  </nav>
  <!-- button -->
  <button class="button  px-4 py-2 md:px-6 md:py-3 text-sm md:text-base">
    <p>ورود/ ثبت نام</p>
  </button>
</header>
<!-- car section -->
<section class="relative h-[350px] sm:h-[400px] md:h-[500px] lg:h-[700px] overflow-hidden">

  <img src="./public/img/car-on-header.jpg" alt="car" class="absolute inset-0 w-full h-full object-cover" />

  <div class="absolute inset-0 flex items-center px-6 md:px-12 lg:px-[10%]">
    <div class=" w-[50%] md:w-[60%] lg:w-[50%] text-white">
      <h1 class="font-bold text-xl sm:text-2xl md:text-3xl lg:text-5xl text-amber-300 leading-relaxed">
        اُتـــو رِنت؛ سریع،<br>
        آسان و به صرفه
      </h1>
      <p class="mt-4 text-sm sm:text-sm md:text-lg lg:text-2xl">
        سرویس دهنده رزرو خودرو در ایران در کمترین زمان ممکن!
      </p>
      <div class="flex flex-col sm:flex-row gap-3 mt-6 w-full ">
        <button
          class="flex items-center justify-center gap-2 border border-white px-4 py-3 rounded-lg text-sm md:text-base w-full sm:w-auto">
          <img class="w-4 h-4" src="./public/img/icons/arrow.svg" alt="">
          <p>تماس با ما</p>
        </button>
        <button
          class="flex items-center justify-center gap-2 bg-amber-400 text-black px-4 py-3 rounded-lg text-sm md:text-base w-full sm:w-auto">
          <img class="w-4 h-4" src="./public/img/icons/car-icon.png" alt="">
          <p>رزرو</p>
        </button>
      </div>
    </div>
  </div>
</section>
<!-- car section done -->
<!-- car rent -->
<div
  class="w-full lg:w-10/12 bg-white lg:px-10 lg:py-3 px-4 py-3 border border-neutral-50 mx-auto rounded-2xl relative flex flex-col">
  <!-- top section -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <!-- buttons -->
    <div class="flex gap-2 ">
      <button class="button-rent lg:px-3 lg:py-1.5 md:px-3 md:py-1.5 px-0.5 py-1.5  rounded-3xl text-sm md:text-base">
        اجاره خودرو با راننده
      </button>

      <button class="button-rent lg:px-3 lg:py-1.5 md:px-3 md:py-1.5 px-0.5 py-1.5  rounded-3xl text-sm md:text-base">
        اجاره خودرو بی راننده
      </button>

      <button class="button-rent lg:px-3 lg:py-1.5 md:px-3 md:py-1.5  px-0.5 py-1.5  rounded-3xl s-small md:text-base">
        اجاره ماشین عروس
      </button>
    </div>

    <!-- link -->
    <a href="#" class="text-primary-500 text-sm md:text-base  ">
      اطلاعات بیشتر در مورد رزرو خودرو
    </a>
  </div>
</div>

<div class="w-full h-10000"></div>


</html>
